<!doctype html><html lang="te"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASTER MINDS ACADEMY Quiz Battle</title>
<style>
body{margin:0;background:#eef5ff;color:#17304d;font-family:Arial,"Noto Sans Telugu",sans-serif}header{background:linear-gradient(110deg,#073b83,#087fbd);color:white;text-align:center;padding:22px}main{max-width:850px;margin:18px auto;padding:0 12px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #1235}h1{margin:0;font-size:26px}label{display:block;font-weight:bold;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #bdcfe3;border-radius:9px;font-size:16px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.score{background:#edf5ff;padding:12px;border-radius:10px}.score b{display:block;font-size:23px;color:#0866c8}button{padding:13px;border:0;border-radius:10px;background:#1266d5;color:white;font-weight:bold;font-size:16px;cursor:pointer}.option{background:#f1f7ff;color:#17304d;border:2px solid #cbdcf0;text-align:left}.option:disabled{opacity:.65}.hide{display:none}.question{font-size:21px;font-weight:bold;line-height:1.5}.notice{padding:12px;border-radius:10px;background:#e5f8ed;margin-top:12px}.bad{background:#fff0f0}.muted{color:#60758e;font-size:14px}@media(max-width:520px){.grid,.scores{grid-template-columns:1fr}}
</style><header><h1>🎓 MASTER MINDS ACADEMY</h1>TIRYANI • QUIZ BATTLE</header><main>
<section class="card" id="setup"><h2>🎮 Start Quiz Battle</h2><div class="grid"><div><label>Players / ఆటగాళ్లు</label><select id="count"><option value="2">2 Members – 2 Options</option><option value="4" selected>4 Members – 4 Options</option></select></div><div><label>Subject / విషయం</label><select id="cat"><option value="mixed">Mixed Quiz</option><option value="gk">General Knowledge</option><option value="math">Maths</option><option value="science">Science & EVS</option><option value="english">English</option></select></div></div><div id="names" class="grid"></div><p class="muted">ప్రతి సరైన సమాధానానికి 10 పాయింట్లు. ముందుగా 100 పాయింట్లు సాధించినవారు విజేత.</p><button id="start">Start Game ▶</button></section>
<section class="card hide" id="game"><div class="muted" id="qno"></div><div class="scores" id="scores"></div><p class="notice" id="turn"></p><div class="question" id="question"></div><div class="grid" id="options"></div><div id="feedback"></div><p><button id="back" style="background:#60758e">End / Back</button></p></section>
<section class="card hide" id="result"><h2>🏆 Winner</h2><div class="question" id="winner"></div><p id="final"></p><button onclick="location.reload()">Play Again</button></section>
</main><script>
const data={
gk:[["భారతదేశ రాజధాని? / Capital of India?",["Mumbai","New Delhi","Chennai","Kolkata"],1],["భారత జాతీయ జంతువు? / National animal?",["Lion","Elephant","Tiger","Deer"],2],["అతిపెద్ద గ్రహం? / Largest planet?",["Earth","Jupiter","Mars","Venus"],1],["భారత జాతీయ పక్షి? / National bird?",["Peacock","Parrot","Crow","Swan"],0],["తెలంగాణ అవతరణ దినోత్సవం? / Telangana Formation Day?",["June 2","August 15","January 26","November 1"],0]],
math:[["12 + 8 = ?",["18","20","22","24"],1],["9 × 7 = ?",["56","63","72","69"],1],["100 లో సగం? / Half of 100?",["25","40","50","60"],2],["144 ÷ 12 = ?",["10","11","12","14"],2],["చతురస్రానికి ఎన్ని భుజాలు? / Square sides?",["3","4","5","6"],1]],
science:[["మొక్కలు ఆహారం తయారు చేసే ప్రక్రియ? / Photosynthesis is?",["Respiration","Photosynthesis","Digestion","Evaporation"],1],["రక్తాన్ని పంపే అవయవం? / Pumps blood?",["Brain","Heart","Lungs","Liver"],1],["నీటి సూత్రం? / Formula of water?",["CO₂","O₂","H₂O","NaCl"],2],["సూర్యుడు ఏ దిశలో ఉదయిస్తాడు? / Sun rises in?",["West","North","South","East"],3],["శ్వాసకు అవసరమైన వాయువు? / Gas needed to breathe?",["Oxygen","Nitrogen","Helium","Hydrogen"],0]],
english:[["Plural of Child?",["Childs","Children","Childes","Childrens"],1],["Opposite of Hot?",["Warm","Cold","Big","Fast"],1],["Which is a vowel?",["B","K","A","T"],2],["Correct spelling?",["Bautiful","Beautifull","Beautiful","Beutiful"],2],["Past tense of Go?",["Goed","Gone","Went","Going"],2]]};
let players=[],qs=[],qi=0,turn=0;
const $=x=>document.getElementById(x);
function names(){let n=+$("count").value;$("names").innerHTML="";for(let i=0;i<n;i++)$("names").innerHTML+=`<div><label>Player ${i+1} Name</label><input id="p${i}" value="Player ${i+1}" maxlength="22"></div>`}
$("count").onchange=names;names();
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){let n=+$("count").value;players=Array.from({length:n},(_,i)=>({name:$("p"+i).value.trim()||"Player "+(i+1),score:0}));let c=$("cat").value;qs=shuffle(c==="mixed"?Object.values(data).flat():data[c]);qi=0;turn=0;$("setup").classList.add("hide");$("game").classList.remove("hide");draw()}
function draw(){let q=qs[qi%qs.length];$("qno").textContent="Question "+(qi+1);$("scores").innerHTML=players.map(p=>`<div class="score">${p.name}<b>${p.score} / 100</b></div>`).join("");$("turn").textContent=players[turn].name+" – మీ వంతు / Your turn";$("question").textContent=q[0];$("feedback").innerHTML="";let opts=q[1].map((v,i)=>({v,ok:i===q[2]}));opts=players.length===2?shuffle([opts[q[2]],shuffle(opts.filter(x=>!x.ok))[0]]):shuffle(opts);$("options").innerHTML="";opts.forEach((o,i)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+". "+o.v;b.onclick=()=>answer(o.ok);$("options").appendChild(b)})}
function answer(ok){[...$("options").children].forEach(b=>b.disabled=true);if(ok){players[turn].score+=10;$("feedback").innerHTML='<div class="notice">సరైన సమాధానం! +10 points 🎉</div>'}else $("feedback").innerHTML='<div class="notice bad">తప్పు సమాధానం. 0 points.</div>';if(players[turn].score>=100){setTimeout(()=>finish(),650);return}turn++;if(turn===players.length){turn=0;qi++}setTimeout(draw,850)}
function finish(){let w=players.filter(p=>p.score>=100);$("game").classList.add("hide");$("result").classList.remove("hide");$("winner").textContent=w.length>1?"Tie – టైబ్రేకర్ అవసరం!":"🎉 "+w[0].name+" is the WINNER!";$("final").innerHTML=players.map(p=>p.name+": <b>"+p.score+"</b> points").join("<br>")}
$("start").onclick=start;$("back").onclick=()=>{if(confirm("End this game?"))location.reload()};
</script></html>

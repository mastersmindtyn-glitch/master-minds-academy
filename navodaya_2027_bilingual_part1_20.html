<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navodaya 2027 Bilingual</title><style>
body{margin:0;background:#eef5ff;color:#172b4d;font-family:Arial}header{background:linear-gradient(120deg,#082b63,#0786ad);color:white;text-align:center;padding:22px}main{max-width:720px;margin:18px auto;padding:12px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 18px #1232}.te{color:#075c83;font-size:19px;line-height:1.6}.opt{display:block;width:100%;padding:14px;margin:9px 0;border:2px solid #d5e1ef;border-radius:10px;background:white;text-align:left;font-size:17px}.opt:disabled{opacity:1}.right{background:#e5f8eb;border-color:#159447}.wrong{background:#fff0f0;border-color:#c33}.feedback{display:none;background:#f0f6ff;padding:14px;border-radius:10px;line-height:1.6}.feedback.show{display:block}button.next{background:#087eaa;color:white;border:0;border-radius:9px;padding:13px 20px;margin-top:14px;font-size:16px}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold;color:#31506f}.bar{height:8px;background:#dce8f5;border-radius:9px;margin:12px 0}.fill{height:8px;background:#08a6c8;width:0;border-radius:9px}</style></head><body><header><h2>🎯 NAVODAYA CLASS 6 – 2027</h2><b>MASTER MINDS ACADEMY – TIRYANI</b><p>Telugu + English | Step-by-step Solutions</p></header><main><div class="card"><div class="meta"><span>Mental Ability – Pattern & Reasoning</span><span id="count"></span><span id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h3 id="en"></h3><div class="te" id="te"></div><div id="opts"></div><div class="feedback" id="fb"></div><button class="next" id="next" style="display:none" onclick="advance()">Next Question →</button><h2 id="result" style="display:none"></h2></div></main><script>
const Q=[{"en": "Find the next number: 2, 4, 6, 8, ___.", "te": "తదుపరి సంఖ్య: 2, 4, 6, 8, ___.", "opts": ["9", "10", "11", "12"], "ans": 1, "se": "Add 2 each time: 8 + 2 = 10.", "st": "ప్రతి సారి 2 కలపాలి: 8 + 2 = 10."}, {"en": "Find the next number: 3, 6, 12, 24, ___.", "te": "తదుపరి సంఖ్య: 3, 6, 12, 24, ___.", "opts": ["36", "42", "48", "54"], "ans": 2, "se": "Multiply by 2 each time: 24 × 2 = 48.", "st": "ప్రతి సంఖ్యను 2తో గుణించాలి: 24 × 2 = 48."}, {"en": "Which number is odd? 2, 4, 6, 9, 10", "te": "ఏది బేసి సంఖ్య? 2, 4, 6, 9, 10", "opts": ["2", "4", "9", "10"], "ans": 2, "se": "2, 4, 6 and 10 are even; 9 is odd.", "st": "2, 4, 6, 10 సరి సంఖ్యలు; 9 బేసి సంఖ్య."}, {"en": "Complete: A, C, E, G, ___.", "te": "పూర్తి చేయండి: A, C, E, G, ___.", "opts": ["H", "I", "J", "K"], "ans": 1, "se": "Skip one letter each time. The next is I.", "st": "ప్రతి సారి ఒక అక్షరం వదలాలి. తదుపరి I."}, {"en": "Find the next number: 5, 10, 15, 20, ___.", "te": "తదుపరి సంఖ్య: 5, 10, 15, 20, ___.", "opts": ["22", "24", "25", "30"], "ans": 2, "se": "Add 5: 20 + 5 = 25.", "st": "5 కలపాలి: 20 + 5 = 25."}, {"en": "If CAT is coded as DBU, how is DOG coded?", "te": "CAT ను DBUగా కోడ్ చేస్తే DOG ఎలా ఉంటుంది?", "opts": ["EPH", "EOG", "DPH", "FPH"], "ans": 0, "se": "Move each letter one step forward: D→E, O→P, G→H.", "st": "ప్రతి అక్షరాన్ని ఒక స్థానం ముందుకు జరపాలి: D→E, O→P, G→H."}, {"en": "Which shape has 3 sides?", "te": "3 భుజాలు ఉన్న ఆకారం ఏది?", "opts": ["Square / చతురస్రం", "Triangle / త్రిభుజం", "Circle / వృత్తం", "Rectangle / దీర్ఘచతురస్రం"], "ans": 1, "se": "A triangle has three sides.", "st": "త్రిభుజానికి మూడు భుజాలు ఉంటాయి."}, {"en": "Find the missing number: 7, 14, 21, __, 35.", "te": "ఖాళీ సంఖ్య: 7, 14, 21, __, 35.", "opts": ["25", "27", "28", "30"], "ans": 2, "se": "Add 7: 21 + 7 = 28.", "st": "7 కలపాలి: 21 + 7 = 28."}, {"en": "Which comes next? Z, X, V, T, ___.", "te": "తదుపరి అక్షరం: Z, X, V, T, ___.", "opts": ["S", "R", "Q", "P"], "ans": 1, "se": "Move two letters backward: Z, X, V, T, R.", "st": "రెండు అక్షరాలు వెనక్కి వెళ్లాలి: Z, X, V, T, R."}, {"en": "Find the odd one out.", "te": "భిన్నమైనదాన్ని గుర్తించండి.", "opts": ["Rose / గులాబీ", "Lotus / కమలం", "Mango / మామిడి", "Jasmine / మల్లె"], "ans": 2, "se": "Rose, lotus and jasmine are flowers; mango is a fruit.", "st": "గులాబీ, కమలం, మల్లె పూలు; మామిడి పండు."}, {"en": "A is taller than B. B is taller than C. Who is shortest?", "te": "A, B కంటే పొడవు; B, C కంటే పొడవు. పొట్టివారు ఎవరు?", "opts": ["A", "B", "C", "Cannot say / చెప్పలేము"], "ans": 2, "se": "A > B > C, so C is shortest.", "st": "ఎత్తు A > B > C. కాబట్టి C పొట్టివాడు."}, {"en": "Find the next number: 1, 4, 9, 16, ___.", "te": "తదుపరి సంఖ్య: 1, 4, 9, 16, ___.", "opts": ["20", "24", "25", "36"], "ans": 2, "se": "These are squares: 1², 2², 3², 4²; next 5² = 25.", "st": "ఇవి వర్గసంఖ్యలు: 1², 2², 3², 4²; తదుపరి 5² = 25."}, {"en": "If today is Monday, what day is after 3 days?", "te": "ఈ రోజు సోమవారం అయితే 3 రోజుల తర్వాత ఏ రోజు?", "opts": ["Tuesday / మంగళవారం", "Wednesday / బుధవారం", "Thursday / గురువారం", "Friday / శుక్రవారం"], "ans": 2, "se": "Tuesday, Wednesday, Thursday: three days later.", "st": "మంగళ, బుధ, గురు: మూడు రోజుల తర్వాత గురువారం."}, {"en": "Complete: 2, 5, 8, 11, ___.", "te": "పూర్తి చేయండి: 2, 5, 8, 11, ___.", "opts": ["12", "13", "14", "15"], "ans": 2, "se": "Add 3: 11 + 3 = 14.", "st": "3 కలపాలి: 11 + 3 = 14."}, {"en": "Which is the smallest?", "te": "అతి చిన్నది ఏది?", "opts": ["0.5", "0.05", "0.55", "0.15"], "ans": 1, "se": "0.05 is five hundredths, smaller than the others.", "st": "0.05 మిగతా సంఖ్యల కంటే చిన్నది."}, {"en": "If 4 = 16 and 5 = 25, then 6 = ?", "te": "4 = 16, 5 = 25 అయితే 6 = ?", "opts": ["30", "32", "36", "42"], "ans": 2, "se": "Square the number: 6² = 36.", "st": "సంఖ్యకు వర్గం: 6² = 36."}, {"en": "Bird : Nest. Choose the similar pair.", "te": "పక్షి : గూడు. ఇలాంటి సంబంధం ఉన్న జతను ఎంచుకోండి.", "opts": ["Dog : Kennel / కుక్క : కెన్నెల్", "Fish : Water / చేప : నీరు", "Cow : Grass / ఆవు : గడ్డి", "Bee : Honey / తేనెటీగ : తేనె"], "ans": 0, "se": "A nest is a bird's home; a kennel is a dog's home.", "st": "గూడు పక్షి నివాసం; కెన్నెల్ కుక్క నివాసం."}, {"en": "Find the missing letter: B, D, F, H, ___.", "te": "ఖాళీ అక్షరం: B, D, F, H, ___.", "opts": ["I", "J", "K", "L"], "ans": 1, "se": "Skip one letter each time; next is J.", "st": "ప్రతి సారి ఒక అక్షరం వదలాలి; తదుపరి J."}, {"en": "At 3:00, what is the angle between clock hands?", "te": "3:00 గంటలకు గడియార ముళ్ల మధ్య కోణం ఎంత?", "opts": ["45°", "60°", "90°", "180°"], "ans": 2, "se": "The hands point to 12 and 3, forming 90°.", "st": "ముళ్లు 12, 3 వద్ద ఉంటాయి; 90° కోణం ఏర్పడుతుంది."}, {"en": "Arrange in ascending order: 8, 3, 10, 1.", "te": "ఆరోహణ క్రమంలో అమర్చండి: 8, 3, 10, 1.", "opts": ["1, 3, 8, 10", "10, 8, 3, 1", "3, 1, 8, 10", "1, 8, 3, 10"], "ans": 0, "se": "Ascending means smallest to largest: 1, 3, 8, 10.", "st": "ఆరోహణ క్రమం చిన్నది నుంచి పెద్దది: 1, 3, 8, 10."}];let i=0,s=0,locked=false;function draw(){locked=false;let q=Q[i];en.textContent=q.en;te.textContent=q.te;count.textContent=`Question ${i+1} / ${Q.length}`;score.textContent=`Score: ${s}`;fill.style.width=(i/Q.length*100)+'%';fb.className='feedback';fb.innerHTML='';next.style.display='none';opts.innerHTML='';q.opts.forEach((v,n)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[n]+') '+v;b.onclick=()=>pick(n);opts.appendChild(b)})}
function pick(n){if(locked)return;locked=true;let q=Q[i],bs=[...opts.children];bs.forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add('right');if(k===n&&n!==q.ans)b.classList.add('wrong')});let ok=n===q.ans;if(ok)s++;fb.className='feedback show';fb.innerHTML=`<b style="color:${ok?'#087b36':'#b42318'}">${ok?'✓ Correct! / సరైన సమాధానం!':'✗ Incorrect / తప్పు సమాధానం'}</b><p><b>Answer / సమాధానం:</b> ${'ABCD'[q.ans]}) ${q.opts[q.ans]}</p><p><b>Solution (English):</b> ${q.se}</p><p class="te"><b>పరిష్కారం (తెలుగు):</b> ${q.st}</p>`;score.textContent=`Score: ${s}`;next.style.display='inline-block';next.textContent=i===Q.length-1?'See Result / ఫలితం':'Next Question →'}
function advance(){if(i<Q.length-1){i++;draw()}else{en.style.display='none';te.style.display='none';opts.style.display='none';fb.style.display='none';next.style.display='none';result.style.display='block';result.textContent=`Completed! / పూర్తయింది! Score: ${s} / ${Q.length}`;fill.style.width='100%'}}draw();
</script></body></html>

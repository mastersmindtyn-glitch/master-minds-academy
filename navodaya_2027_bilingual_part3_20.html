<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10234f"><title>Navodaya 2027 Part 3</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6ff;color:#14264f}header{background:linear-gradient(120deg,#10234f,#1769aa);color:white;text-align:center;padding:24px 14px}header h1{margin:0 0 8px;font-size:25px}.wrap{max-width:800px;margin:22px auto;padding:0 14px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 28px #10234f18}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#52658a;font-weight:bold}.track{height:9px;background:#e5eafa;border-radius:20px;margin:14px 0 20px;overflow:hidden}.bar{height:100%;background:#2361dc;width:0}.qnum{color:#2361dc;font-weight:bold}.question{font-size:21px;line-height:1.5;font-weight:bold;margin:10px 0}.tel{font-size:19px;line-height:1.6;margin:8px 0 18px}.options{display:grid;gap:10px}.option{border:2px solid #dce4f5;background:white;border-radius:12px;padding:13px;text-align:left;font-size:17px;color:#14264f}.option:disabled{opacity:1}.correct{border-color:#15965c;background:#eaf9f1}.wrong{border-color:#d43d48;background:#fff0f1}.feedback{display:none;margin-top:16px;padding:15px;border-radius:12px;line-height:1.6}.feedback.show{display:block}.good{background:#eaf9f1;color:#075b35}.bad{background:#fff0f1;color:#8b2029}button.primary{background:#245cdb;color:white;border:0;border-radius:12px;padding:13px 20px;font-size:17px;font-weight:bold;margin-top:18px}button:disabled{opacity:.45}.small{font-size:14px;color:#667797}@media(max-width:520px){.card{padding:16px}.question{font-size:19px}.tel{font-size:17px}}</style></head><body>
<header><h1>🎯 NAVODAYA 2027 – PART 3</h1><div>Arithmetic / గణితం</div><p>MASTER MINDS ACADEMY • TIRYANI</p></header><div class="wrap"><div class="card" id="quiz"><div class="top"><span id="count"></span><span id="score"></span></div><div class="track"><div class="bar" id="bar"></div></div><div class="qnum" id="qnum"></div><div class="question" id="en"></div><div class="tel" id="te"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="primary" id="next" disabled>Next Question / తదుపరి ప్రశ్న →</button><p class="small">Select one option to see the answer and explanation. / సమాధానం ఎంచుకుంటే వివరణ కనిపిస్తుంది.</p></div></div>
<script>const Q=[["What is 375 + 248?", "375 + 248 విలువ ఎంత?", ["613", "623", "633", "643"], 1, "375 + 200 = 575; 575 + 48 = 623."], ["Find 900 − 467.", "900 − 467 విలువ కనుగొనండి.", ["423", "433", "443", "453"], 1, "900 − 400 = 500; 500 − 67 = 433."], ["What is 24 × 15?", "24 × 15 విలువ ఎంత?", ["340", "350", "360", "370"], 2, "24 × 15 = 24 × (10 + 5) = 240 + 120 = 360."], ["Calculate 864 ÷ 12.", "864 ÷ 12 విలువ ఎంత?", ["62", "72", "82", "92"], 1, "12 × 72 = 864, కాబట్టి సమాధానం 72."], ["Which is the smallest fraction?", "క్రింది భిన్నాలలో అతి చిన్నది ఏది?", ["1/2", "1/3", "1/4", "1/5"], 3, "లవం 1గా ఉన్నప్పుడు హారం పెద్దదైతే భిన్నం చిన్నదవుతుంది. కాబట్టి 1/5."], ["What is 3/4 of 200?", "200లో 3/4 భాగం ఎంత?", ["100", "125", "150", "175"], 2, "200 ÷ 4 = 50; 50 × 3 = 150."], ["Convert 0.75 into a simplest fraction.", "0.75 ను సరళ భిన్నంగా మార్చండి.", ["1/2", "2/3", "3/4", "4/5"], 2, "0.75 = 75/100 = 3/4."], ["A book costs ₹48. What is the cost of 5 books?", "ఒక పుస్తకం ధర ₹48. 5 పుస్తకాల ధర ఎంత?", ["₹220", "₹230", "₹240", "₹250"], 2, "48 × 5 = ₹240."], ["Find the perimeter of a square of side 8 cm.", "8 సెం.మీ. భుజం గల చతురస్రం చుట్టుకొలత ఎంత?", ["16 cm", "24 cm", "32 cm", "64 cm"], 2, "చుట్టుకొలత = 4 × భుజం = 4 × 8 = 32 సెం.మీ."], ["Find the area of a rectangle: 12 cm × 5 cm.", "12 సెం.మీ. × 5 సెం.మీ. దీర్ఘచతురస్ర వైశాల్యం ఎంత?", ["17 cm²", "34 cm²", "60 cm²", "120 cm²"], 2, "వైశాల్యం = పొడవు × వెడల్పు = 12 × 5 = 60 చ.సెం.మీ."], ["How many minutes are there in 3 hours?", "3 గంటలలో ఎన్ని నిమిషాలు ఉంటాయి?", ["120", "150", "180", "210"], 2, "1 గంట = 60 నిమిషాలు; 3 × 60 = 180."], ["A train travels 60 km in 1 hour. How far in 3 hours?", "రైలు గంటకు 60 కి.మీ. వెళ్తుంది. 3 గంటల్లో ఎంత దూరం?", ["120 km", "150 km", "180 km", "240 km"], 2, "దూరం = వేగం × సమయం = 60 × 3 = 180 కి.మీ."], ["Find the average of 10, 20 and 30.", "10, 20, 30 ల సగటు ఎంత?", ["15", "20", "25", "30"], 1, "సగటు = (10 + 20 + 30) ÷ 3 = 20."], ["What is 25% of 400?", "400లో 25 శాతం ఎంత?", ["50", "75", "100", "125"], 2, "25% = 1/4; 400 ÷ 4 = 100."], ["You have 3.5 kg rice and buy 2.25 kg more. Total?", "3.5 కిలోల బియ్యానికి 2.25 కిలోలు కలిపితే మొత్తం ఎంత?", ["5.25 kg", "5.5 kg", "5.75 kg", "6 kg"], 2, "3.50 + 2.25 = 5.75 కిలోలు."], ["Simplify: 18 + 6 × 2.", "సరళీకరించండి: 18 + 6 × 2.", ["30", "48", "36", "24"], 0, "BODMAS ప్రకారం ముందుగా 6 × 2 = 12; తర్వాత 18 + 12 = 30."], ["Place value of 7 in 5,72,416?", "5,72,416 లో 7 యొక్క స్థాన విలువ ఎంత?", ["700", "7,000", "70,000", "7,00,000"], 2, "7 పదివేల స్థానంలో ఉంది. స్థాన విలువ 70,000."], ["Find the LCM of 4 and 6.", "4 మరియు 6 ల క.సా.గు. ఎంత?", ["8", "10", "12", "24"], 2, "4, 6 ల మొదటి ఉమ్మడి గుణిజం 12."], ["Find the HCF of 18 and 24.", "18 మరియు 24 ల గ.సా.భా. ఎంత?", ["3", "6", "9", "12"], 1, "18, 24 లకు అత్యధిక ఉమ్మడి కారణాంకం 6."], ["A shopkeeper returns ₹20 from ₹100. What was the cost?", "₹100 ఇచ్చినప్పుడు ₹20 తిరిగి ఇచ్చారు. వస్తువు ధర ఎంత?", ["₹20", "₹70", "₹80", "₹90"], 2, "ధర = 100 − 20 = ₹80."]];let i=0,score=0,done=false;const E=id=>document.getElementById(id);function draw(){done=false;let q=Q[i];E('count').textContent=`Question ${i+1} of ${Q.length}`;E('score').textContent=`Score: ${score}`;E('qnum').textContent=`QUESTION ${String(i+1).padStart(2,'0')}`;E('bar').style.width=(i/Q.length*100)+'%';E('en').textContent=q[0];E('te').textContent=q[1];E('feedback').className='feedback';E('feedback').innerHTML='';E('next').disabled=true;E('next').textContent=i===Q.length-1?'View Result / ఫలితం':'Next Question / తదుపరి ప్రశ్న →';E('options').innerHTML='';q[2].forEach((v,n)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+n)+'. '+v;b.onclick=()=>answer(n);E('options').appendChild(b)})}function answer(n){if(done)return;done=true;let q=Q[i],bs=[...E('options').children],ok=n===q[3];if(ok)score++;bs.forEach((b,k)=>{b.disabled=true;if(k===q[3])b.classList.add('correct');else if(k===n)b.classList.add('wrong')});E('score').textContent='Score: '+score;E('feedback').className='feedback show '+(ok?'good':'bad');E('feedback').innerHTML='<b>'+(ok?'✓ Correct! / సరైన సమాధానం':'✗ Incorrect / తప్పు సమాధానం')+'</b><br>Correct answer: <b>'+String.fromCharCode(65+q[3])+'. '+q[2][q[3]]+'</b><br><b>Step-by-step explanation / వివరణ:</b><br>'+q[4];E('next').disabled=false;E('bar').style.width=((i+1)/Q.length*100)+'%'}E('next').onclick=()=>{if(i<Q.length-1){i++;draw()}else E('quiz').innerHTML='<h2>🎉 Test Completed!</h2><h2>'+score+' / '+Q.length+'</h2><p>Correct: '+score+' | Wrong: '+(Q.length-score)+'</p><button class="primary" onclick="location.reload()">Restart / మళ్లీ ప్రారంభించండి</button>'};draw();</script></body></html>

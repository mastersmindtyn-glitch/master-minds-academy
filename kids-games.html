<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER MINDS ACADEMY | Kids Games</title>
<style>
:root{--navy:#102a56;--blue:#1769d2;--cyan:#21c4d8;--ink:#183153;--soft:#eef6ff;--green:#16834a;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Telugu",sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf4ff,#f8fcff 55%,#e8fbff);min-height:100vh}
header{background:linear-gradient(110deg,var(--navy),var(--blue),#168eae);color:white;padding:24px 16px;text-align:center}header h1{margin:0;font-size:clamp(22px,5vw,34px)}header p{margin:8px 0 0;font-size:15px}
main{max-width:1000px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid #d9e8f8;border-radius:22px;padding:20px;box-shadow:0 12px 30px #17416b12;margin-bottom:18px}
.intro{text-align:center}.intro h2{margin:4px 0 8px;color:var(--navy)}.intro p{line-height:1.6;margin:0}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px}.category{border:2px solid #dceafa;border-radius:18px;padding:17px 10px;background:#f8fbff;cursor:pointer;font-size:16px;font-weight:700;color:var(--navy);transition:.18s}.category:hover,.category:focus{transform:translateY(-3px);border-color:var(--cyan);background:#effcff}.emoji{display:block;font-size:36px;margin-bottom:8px}
.game{display:none}.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.pill{background:#edf5ff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px}.progress{height:10px;background:#e7eef8;border-radius:20px;overflow:hidden;margin:16px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .25s}
.question{font-size:clamp(21px,4vw,30px);text-align:center;font-weight:800;color:var(--navy);margin:24px 0 18px;line-height:1.5}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{padding:17px 12px;border:2px solid #dbe8f7;border-radius:15px;background:white;font-size:18px;font-weight:700;cursor:pointer;min-height:64px;color:var(--ink)}.option:hover:not(:disabled){border-color:var(--blue);background:#f2f8ff}.option:disabled{cursor:default}.option.correct{background:#e9f8ef;border-color:#25a45e;color:#116a39}.option.wrong{background:#fff0ee;border-color:#e36b5f;color:#a52d24}
.feedback{min-height:54px;text-align:center;font-size:17px;font-weight:700;padding:14px 4px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:800;font-size:16px;cursor:pointer;background:var(--blue);color:white}.btn.secondary{background:#eaf2fc;color:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;padding:20px}.result .big{font-size:64px}.result h2{color:var(--navy)}footer{text-align:center;color:#59718e;padding:18px;font-size:13px}
@media(max-width:520px){.options{grid-template-columns:1fr}.panel{padding:15px}.category{padding:13px 8px}}
</style></head>
<body>
<header><h1>🎓 MASTER MINDS ACADEMY</h1><p>TIRYANI • KIDS EDUCATIONAL GAMES</p></header>
<main>
<section class="panel intro" id="home"><h2>ఆడుతూ నేర్చుకుందాం! 🌟</h2><p>Choose a game • ప్రశ్న చదవండి • సరైన సమాధానాన్ని ఎంచుకోండి • మీ స్కోర్ పెంచుకోండి!</p><div class="categories" id="categories"></div></section>
<section class="panel game" id="game"><div class="topline"><span class="pill" id="gameName">Game</span><span class="pill" id="score">⭐ Score: 0</span><span class="pill" id="counter">1 / 10</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" onclick="goHome()">← Games</button><button class="btn" id="next" onclick="nextQuestion()" disabled>Next ➜</button></div></section>
<section class="panel result" id="result" style="display:none"></section>
</main><footer>మా లక్ష్యం అడ్మిషన్లు కాదు… ప్రతి విద్యార్థిలోని ప్రతిభను వెలికితీయడం.</footer>
<script>
const games=[
{ id:'alphabet',name:'Alphabet',tel:'అక్షరాలు',emoji:'🔤',qs:[
['A for ____','Apple 🍎','Ball ⚽','Cat 🐱','Dog 🐶',0,'A for Apple.'],['B for ____','Sun ☀️','Ball ⚽','Fish 🐟','Ant 🐜',1,'B for Ball.'],['C for ____','Cat 🐱','Dog 🐶','Egg 🥚','Fan 🪭',0,'C for Cat.'],['D for ____','Apple 🍎','Hen 🐔','Dog 🐶','Mango 🥭',2,'D for Dog.'],['Which is a vowel?','B','E','T','P',1,'E is a vowel.'],['Which letter comes after F?','E','G','H','D',1,'G comes after F.'],['Which letter starts the word SUN?','M','S','A','T',1,'SUN starts with S.'],['Which is the last letter of the alphabet?','X','Y','Z','W',2,'Z is the last letter.'],['Which word starts with M?','Moon 🌙','Ball ⚽','Cup ☕','Dog 🐶',0,'Moon starts with M.'],['How many letters are in the English alphabet?','24','25','26','27',2,'There are 26 letters.']]},
{ id:'numbers',name:'Numbers',tel:'సంఖ్యలు',emoji:'🔢',qs:[
['What comes after 5?','4','6','7','8',1,'6 comes after 5.'],['How many stars? ⭐ ⭐ ⭐','2','3','4','5',1,'There are 3 stars.'],['Which is the biggest number?','2','8','5','1',1,'8 is the biggest.'],['10 = ____ + 5','2','3','4','5',3,'5 + 5 = 10.'],['What comes before 9?','7','8','10','6',1,'8 comes before 9.'],['How many sides does a triangle have?','2','3','4','5',1,'A triangle has 3 sides.'],['Double of 4 is?','6','7','8','9',2,'4 + 4 = 8.'],['Which number is even?','3','5','7','8',3,'8 is an even number.'],['Count: 🍎 🍎 🍎 🍎','3','4','5','6',1,'There are 4 apples.'],['What is 10 - 1?','8','9','10','7',1,'10 - 1 = 9.']]},
{ id:'maths',name:'Maths',tel:'గణితం',emoji:'➕',qs:[
['2 + 3 = ?','4','5','6','7',1,'2 + 3 = 5.'],['7 - 4 = ?','2','3','4','5',1,'7 - 4 = 3.'],['3 × 2 = ?','5','6','7','8',1,'3 times 2 = 6.'],['10 ÷ 2 = ?','2','4','5','6',2,'10 divided by 2 = 5.'],['Which is greater?','12','9','7','5',0,'12 is the greatest.'],['A dozen means?','10','11','12','13',2,'A dozen means 12.'],['5 + 5 + 5 = ?','10','12','15','20',2,'5 + 5 + 5 = 15.'],['Half of 20 is?','5','10','15','20',1,'Half of 20 is 10.'],['How many days in a week?','5','6','7','8',2,'A week has 7 days.'],['How many minutes in one hour?','30','45','60','100',2,'One hour has 60 minutes.']]},
{ id:'colours',name:'Colours',tel:'రంగులు',emoji:'🎨',qs:[
['What colour is the sky on a clear day?','Blue','Green','Black','Pink',0,'The sky usually looks blue.'],['Which fruit is usually yellow?','Grape','Banana','Apple','Blueberry',1,'A ripe banana is usually yellow.'],['Mix red and yellow to make?','Green','Purple','Orange','Blue',2,'Red + yellow makes orange.'],['What colour are most leaves?','Green','Pink','White','Blue',0,'Most healthy leaves are green.'],['Which is a rainbow colour?','Brown','Violet','Grey','Black',1,'Violet is a rainbow colour.'],['What colour is milk?','White','Red','Blue','Green',0,'Milk is white.'],['Which colour means STOP in traffic lights?','Green','Blue','Red','White',2,'Red means stop.'],['Mix blue and yellow to make?','Purple','Green','Orange','Pink',1,'Blue + yellow makes green.'],['What colour is a ripe tomato?','Red','Blue','Black','Purple',0,'A ripe tomato is commonly red.'],['Which is a dark colour?','White','Yellow','Black','Cream',2,'Black is a dark colour.']]},
{ id:'animals',name:'Animals',tel:'జంతువులు',emoji:'🐘',qs:[
['Which animal is called the king of the jungle?','Tiger','Lion','Deer','Rabbit',1,'The lion is popularly called the king of the jungle.'],['Which animal gives us wool?','Sheep','Dog','Cat','Horse',0,'Sheep provide wool.'],['Which is the largest land animal?','Horse','Elephant','Tiger','Bear',1,'The African elephant is the largest land animal.'],['Which animal lives in water?','Camel','Fish','Cow','Goat',1,'Fish live in water.'],['Which bird can mimic human speech?','Crow','Parrot','Owl','Eagle',1,'Parrots can imitate sounds.'],['What is a baby dog called?','Kitten','Calf','Puppy','Cub',2,'A baby dog is a puppy.'],['Which animal has a long neck?','Giraffe','Zebra','Fox','Pig',0,'A giraffe has a very long neck.'],['Which animal is known for its black and white stripes?','Lion','Zebra','Deer','Camel',1,'A zebra has black and white stripes.'],['Which animal is known as the ship of the desert?','Camel','Horse','Elephant','Yak',0,'The camel is called the ship of the desert.'],['Which insect makes honey?','Ant','Butterfly','Honeybee','Mosquito',2,'Honeybees make honey.']]},
{ id:'gk',name:'General Knowledge',tel:'సాధారణ జ్ఞానం',emoji:'🌍',qs:[
['What is the capital of India?','Mumbai','New Delhi','Chennai','Kolkata',1,'New Delhi is the capital of India.'],['What is our national bird?','Parrot','Peacock','Crow','Sparrow',1,'The Indian peacock is our national bird.'],['How many colours are there in a rainbow?','5','6','7','8',2,'A rainbow is commonly described as having seven colours.'],['Which planet do we live on?','Mars','Earth','Venus','Jupiter',1,'We live on planet Earth.'],['What is the national animal of India?','Lion','Elephant','Bengal Tiger','Leopard',2,'The Bengal tiger is India’s national animal.'],['Which is the festival of lights?','Holi','Diwali','Eid','Pongal',1,'Diwali is known as the festival of lights.'],['How many days are there in a leap year?','365','366','364','360',1,'A leap year has 366 days.'],['Which is the nearest star to Earth?','Sirius','Sun','Polaris','Vega',1,'The Sun is the nearest star to Earth.'],['What do plants need to make food?','Sunlight','Plastic','Smoke','Sand only',0,'Plants use sunlight to make food by photosynthesis.'],['Which direction does the Sun rise from?','West','North','East','South',2,'The Sun appears to rise in the east.']]}
];
let active=null,index=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function renderCategories(){ $('categories').innerHTML=games.map(g=>`<button class="category" onclick="startGame('${g.id}')"><span class="emoji">${g.emoji}</span>${g.name}<br><small>${g.tel}</small></button>`).join('') }
function startGame(id){active=games.find(g=>g.id===id);index=0;score=0;$('home').style.display='none';$('result').style.display='none';$('game').style.display='block';showQuestion();window.scrollTo({top:0,behavior:'smooth'})}
function showQuestion(){answered=false;const q=active.qs[index];$('gameName').textContent=active.emoji+' '+active.name;$('score').textContent='⭐ Score: '+score;$('counter').textContent=(index+1)+' / '+active.qs.length;$('bar').style.width=(index/active.qs.length*100)+'%';$('question').textContent=q[0];$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===active.qs.length-1?'See Result 🏆':'Next ➜';$('options').innerHTML=q.slice(1,5).map((v,i)=>`<button class="option" onclick="chooseAnswer(${i},this)">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}
function beep(ok){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:220;g.gain.value=.07;o.start();o.stop(c.currentTime+.16)}catch(e){}}
function chooseAnswer(choice,btn){if(answered)return;answered=true;const q=active.qs[index],correct=q[5],buttons=[...$('options').children];buttons.forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct')});if(choice===correct){score++;btn.classList.add('correct');$('feedback').textContent='🎉 చాలా బాగుంది! Correct! '+q[6];beep(true)}else{btn.classList.add('wrong');$('feedback').textContent='😊 మంచి ప్రయత్నం! సరైన సమాధానం: '+q[correct+1]+'. '+q[6];beep(false)}$('score').textContent='⭐ Score: '+score;$('next').disabled=false;$('bar').style.width=((index+1)/active.qs.length*100)+'%'}
function nextQuestion(){if(!answered)return;if(index<active.qs.length-1){index++;showQuestion()}else{showResult()}}
function showResult(){$('game').style.display='none';$('result').style.display='block';const pct=Math.round(score/active.qs.length*100);let msg=pct===100?'అద్భుతం! You are a Star! 🌟':pct>=70?'చాలా బాగా ఆడారు! Great job! 👏':'మంచి ప్రయత్నం! Keep practising! 💪';$('result').innerHTML=`<div class="big">${pct>=70?'🏆':'🌈'}</div><h2>${msg}</h2><p style="font-size:22px;font-weight:bold">Your Score: ${score} / ${active.qs.length}</p><p>${pct}% correct answers</p><div class="actions"><button class="btn" onclick="startGame('${active.id}')">Play Again 🔁</button><button class="btn secondary" onclick="goHome()">Choose Another Game</button></div>`;window.scrollTo({top:0,behavior:'smooth'})}
function goHome(){$('game').style.display='none';$('result').style.display='none';$('home').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
renderCategories();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navodaya 2027 Part 2</title><style>
body{margin:0;background:#eef5ff;color:#172b4d;font-family:Arial,"Noto Sans Telugu",sans-serif}header{background:linear-gradient(120deg,#082b63,#0786ad);color:white;text-align:center;padding:22px}main{max-width:720px;margin:18px auto;padding:12px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 18px #1232}.te{color:#075c83;font-size:19px;line-height:1.6}.opt{display:block;width:100%;padding:14px;margin:9px 0;border:2px solid #d5e1ef;border-radius:10px;background:white;text-align:left;font-size:17px}.opt:disabled{opacity:1}.right{background:#e5f8eb;border-color:#159447}.wrong{background:#fff0f0;border-color:#c33}.feedback{display:none;background:#f0f6ff;padding:14px;border-radius:10px;line-height:1.6}.feedback.show{display:block}button.next{background:#087eaa;color:white;border:0;border-radius:9px;padding:13px 20px;margin-top:14px;font-size:16px}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold;color:#31506f}.bar{height:8px;background:#dce8f5;border-radius:9px;margin:12px 0}.fill{height:8px;background:#08a6c8;width:0;border-radius:9px}</style></head><body><header><h2>🎯 NAVODAYA CLASS 6 – 2027</h2><b>MASTER MINDS ACADEMY – TIRYANI</b><p>Part 2 | Analogy, Classification, Directions & Reasoning</p><p>Telugu + English | Step-by-step Solutions</p></header><main><div class="card"><div class="meta"><span>Mental Ability – Reasoning</span><span id="count"></span><span id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h3 id="en"></h3><div class="te" id="te"></div><div id="opts"></div><div class="feedback" id="fb"></div><button class="next" id="next" style="display:none" onclick="advance()">Next Question →</button><h2 id="result" style="display:none"></h2></div></main><script>
const Q=[{"en": "Choose the related pair: Hand : Glove :: Foot : ?", "te": "సంబంధిత జతను ఎంచుకోండి: చెయ్యి : గ్లౌవ్ :: పాదం : ?", "opts": ["Sock / సాక్స్", "Cap / టోపీ", "Shirt / చొక్కా", "Belt / బెల్ట్"], "ans": 0, "se": "A glove is worn on a hand; a sock is worn on a foot.", "st": "గ్లౌవ్‌ను చేతికి ధరిస్తారు; సాక్స్‌ను పాదానికి ధరిస్తారు."}, {"en": "Choose the related pair: Doctor : Hospital :: Teacher : ?", "te": "సంబంధిత జత: డాక్టర్ : ఆసుపత్రి :: ఉపాధ్యాయుడు : ?", "opts": ["Market / మార్కెట్", "School / పాఠశాల", "Bank / బ్యాంకు", "Court / కోర్టు"], "ans": 1, "se": "A doctor commonly works in a hospital; a teacher works in a school.", "st": "డాక్టర్ సాధారణంగా ఆసుపత్రిలో పనిచేస్తారు; ఉపాధ్యాయుడు పాఠశాలలో పనిచేస్తారు."}, {"en": "Find the odd one out.", "te": "భిన్నమైనదాన్ని గుర్తించండి.", "opts": ["January / జనవరి", "March / మార్చి", "May / మే", "Monday / సోమవారం"], "ans": 3, "se": "January, March and May are months; Monday is a day.", "st": "జనవరి, మార్చి, మే నెలలు; సోమవారం ఒక వారం రోజు."}, {"en": "Find the odd one out.", "te": "భిన్నమైనదాన్ని గుర్తించండి.", "opts": ["Carrot / క్యారెట్", "Potato / బంగాళాదుంప", "Onion / ఉల్లిపాయ", "Grapes / ద్రాక్ష"], "ans": 3, "se": "Carrot, potato and onion are commonly used as vegetables; grapes are a fruit.", "st": "క్యారెట్, బంగాళాదుంప, ఉల్లిపాయ కూరగాయలు; ద్రాక్ష పండు."}, {"en": "Ravi faces North. He turns right. Which direction is he facing?", "te": "రవి ఉత్తరం వైపు చూస్తున్నాడు. కుడివైపు తిరిగితే ఏ దిశలో ఉంటాడు?", "opts": ["West / పడమర", "East / తూర్పు", "South / దక్షిణం", "North / ఉత్తరం"], "ans": 1, "se": "A right turn from North points East.", "st": "ఉత్తరం నుంచి కుడివైపు తిరిగితే తూర్పు దిశ వస్తుంది."}, {"en": "A person walks 5 m East, then 5 m West. Where is the person from the starting point?", "te": "ఒక వ్యక్తి 5 మీటర్లు తూర్పుకు, తరువాత 5 మీటర్లు పడమరకు నడిచాడు. ప్రారంభ స్థానం నుంచి ఇప్పుడు ఎక్కడ ఉన్నాడు?", "opts": ["5 m East / 5 మీ. తూర్పు", "5 m West / 5 మీ. పడమర", "At starting point / ప్రారంభ స్థానంలో", "10 m East / 10 మీ. తూర్పు"], "ans": 2, "se": "The east and west movements cancel each other. The person returns to the start.", "st": "తూర్పు, పడమర దిశల్లో సమాన దూరం నడవడంతో మళ్లీ ప్రారంభ స్థానానికి వస్తాడు."}, {"en": "Your mother's brother is your _____.", "te": "మీ తల్లి సోదరుడు మీకు ఏమవుతాడు?", "opts": ["Uncle / మేనమామ", "Grandfather / తాత", "Cousin / బంధువు", "Nephew / మేనల్లుడు"], "ans": 0, "se": "Your mother's brother is your maternal uncle.", "st": "తల్లి సోదరుడు మేనమామ అవుతాడు."}, {"en": "A is the brother of B. B is the sister of C. How is A related to C?", "te": "A, Bకి సోదరుడు. B, Cకి సోదరి. Aకి Cతో ఉన్న సంబంధం ఏమిటి?", "opts": ["Brother / సోదరుడు", "Sister / సోదరి", "Father / తండ్రి", "Uncle / మామ"], "ans": 0, "se": "A and C are siblings; A is male, so A is C's brother.", "st": "A, C ఇద్దరూ తోబుట్టువులు. A పురుషుడు కాబట్టి Cకి సోదరుడు."}, {"en": "Arrange from smallest to largest: 0.7, 0.07, 0.77, 0.17.", "te": "చిన్నది నుంచి పెద్దదిగా అమర్చండి: 0.7, 0.07, 0.77, 0.17.", "opts": ["0.07, 0.17, 0.7, 0.77", "0.7, 0.07, 0.17, 0.77", "0.17, 0.07, 0.77, 0.7", "0.77, 0.7, 0.17, 0.07"], "ans": 0, "se": "Write them as hundredths: 0.07, 0.17, 0.70, 0.77.", "st": "వందవ భాగాలుగా చూస్తే 0.07, 0.17, 0.70, 0.77 క్రమం వస్తుంది."}, {"en": "If all roses are flowers, which statement is definitely true?", "te": "అన్ని గులాబీలు పూలే అయితే, ఖచ్చితంగా నిజమైన వాక్యం ఏది?", "opts": ["All flowers are roses / అన్ని పూలు గులాబీలే", "Every rose is a flower / ప్రతి గులాబీ ఒక పువ్వు", "No rose is a flower / గులాబీ పువ్వు కాదు", "All roses are trees / అన్ని గులాబీలు చెట్లు"], "ans": 1, "se": "The given statement directly says every rose belongs to the group of flowers.", "st": "ఇచ్చిన వాక్యం ప్రకారం ప్రతి గులాబీ పూల సమూహానికి చెందుతుంది."}, {"en": "Which word cannot be made from the letters of 'GARDEN'?", "te": "'GARDEN' అక్షరాలతో ఏ పదాన్ని తయారు చేయలేము?", "opts": ["RANGE", "ANGER", "DANGER", "GARDENER"], "ans": 3, "se": "GARDENER needs extra letters, including another E and R, which are not available in GARDEN.", "st": "GARDENER పదానికి అదనపు అక్షరాలు అవసరం. GARDEN లో ఆ అదనపు అక్షరాలు లేవు."}, {"en": "Complete the sequence: 11, 22, 33, 44, ___.", "te": "శ్రేణిని పూర్తి చేయండి: 11, 22, 33, 44, ___.", "opts": ["50", "55", "66", "77"], "ans": 1, "se": "Add 11 each time; 44 + 11 = 55.", "st": "ప్రతి సారి 11 కలపాలి; 44 + 11 = 55."}, {"en": "Which number is divisible by 3?", "te": "3తో భాగించబడే సంఖ్య ఏది?", "opts": ["124", "215", "321", "401"], "ans": 2, "se": "The digit sum of 321 is 3+2+1=6, which is divisible by 3.", "st": "321 అంకెల మొత్తం 3+2+1=6. 6 అనేది 3తో భాగించబడుతుంది."}, {"en": "If 1 January is Wednesday, what day is 8 January?", "te": "జనవరి 1 బుధవారం అయితే జనవరి 8 ఏ రోజు?", "opts": ["Tuesday / మంగళవారం", "Wednesday / బుధవారం", "Thursday / గురువారం", "Friday / శుక్రవారం"], "ans": 1, "se": "Seven days later is the same weekday.", "st": "7 రోజుల తర్వాత అదే వారం రోజు వస్తుంది."}, {"en": "Which is the mirror image of the number 3?", "te": "సంఖ్య 3కు అద్దంలో కనిపించే రూపం ఏది?", "opts": ["Ɛ", "Ɛ", "E", "3"], "ans": 0, "se": "A mirror reverses the left-right orientation; the reversed form of 3 is Ɛ.", "st": "అద్దం ఎడమ-కుడి దిశను తారుమారు చేస్తుంది; 3 యొక్క తిరగబడిన రూపం Ɛ."}, {"en": "In a row, Sita is 5th from the left and 7th from the right. How many people are there?", "te": "ఒక వరుసలో సీత ఎడమ నుంచి 5వది, కుడి నుంచి 7వది. మొత్తం ఎంతమంది?", "opts": ["10", "11", "12", "13"], "ans": 1, "se": "Total = 5 + 7 − 1 = 11; Sita is counted twice, so subtract 1.", "st": "మొత్తం = 5 + 7 − 1 = 11. సీతను రెండుసార్లు లెక్కించినందున 1 తీసివేయాలి."}, {"en": "Which comes next in the pattern: AB, DE, GH, JK, __?", "te": "నమూనాలో తదుపరి ఏది: AB, DE, GH, JK, __?", "opts": ["LM", "MN", "NO", "OP"], "ans": 1, "se": "Each pair advances three letters: AB, DE, GH, JK, MN.", "st": "ప్రతి జత మూడు అక్షరాల చొప్పున ముందుకు వెళ్తుంది: AB, DE, GH, JK, MN."}, {"en": "A clock shows 6:00. What is the angle between its hands?", "te": "గడియారంలో 6:00 అయితే ముళ్ల మధ్య కోణం ఎంత?", "opts": ["90°", "120°", "180°", "360°"], "ans": 2, "se": "At 6:00, the hands point in opposite directions, making 180°.", "st": "6 గంటలకు ముళ్లు ఎదురెదురుగా ఉంటాయి. కాబట్టి 180° కోణం."}, {"en": "If 8 workers finish a task in 6 days, how many worker-days are needed?", "te": "8 మంది కార్మికులు ఒక పనిని 6 రోజుల్లో చేస్తే, మొత్తం ఎన్ని worker-days అవసరం?", "opts": ["14", "36", "42", "48"], "ans": 3, "se": "Worker-days = 8 × 6 = 48.", "st": "Worker-days = 8 × 6 = 48."}, {"en": "Choose the pair with the same relationship: Seed : Plant", "te": "ఇదే సంబంధం ఉన్న జతను ఎంచుకోండి: విత్తనం : మొక్క", "opts": ["Egg : Bird / గుడ్డు : పక్షి", "Leaf : Tree / ఆకు : చెట్టు", "Water : River / నీరు : నది", "Wood : Chair / కలప : కుర్చీ"], "ans": 0, "se": "A seed can grow into a plant; an egg can develop into a bird.", "st": "విత్తనం మొక్కగా పెరుగుతుంది; గుడ్డు నుంచి పక్షి అభివృద్ధి చెందుతుంది."}];let i=0,s=0,locked=false;
function draw(){locked=false;let q=Q[i];en.textContent=q.en;te.textContent=q.te;count.textContent=`Question ${i+1} / ${Q.length}`;score.textContent=`Score: ${s}`;fill.style.width=(i/Q.length*100)+'%';fb.className='feedback';fb.innerHTML='';next.style.display='none';opts.innerHTML='';q.opts.forEach((v,n)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[n]+') '+v;b.onclick=()=>pick(n);opts.appendChild(b)})}
function pick(n){if(locked)return;locked=true;let q=Q[i],bs=[...opts.children];bs.forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add('right');if(k===n&&n!==q.ans)b.classList.add('wrong')});let ok=n===q.ans;if(ok)s++;fb.className='feedback show';fb.innerHTML=`<b style="color:${ok?'#087b36':'#b42318'}">${ok?'✓ Correct! / సరైన సమాధానం!':'✗ Incorrect / తప్పు సమాధానం'}</b><p><b>Answer / సమాధానం:</b> ${'ABCD'[q.ans]}) ${q.opts[q.ans]}</p><p><b>Solution (English):</b> ${q.se}</p><p class="te"><b>పరిష్కారం (తెలుగు):</b> ${q.st}</p>`;score.textContent=`Score: ${s}`;next.style.display='inline-block';next.textContent=i===Q.length-1?'See Result / ఫలితం':'Next Question →'}
function advance(){if(i<Q.length-1){i++;draw()}else{en.style.display='none';te.style.display='none';opts.style.display='none';fb.style.display='none';next.style.display='none';result.style.display='block';result.textContent=`Completed! / పూర్తయింది! Score: ${s} / ${Q.length}`;fill.style.width='100%'}}draw();
</script></body></html>
